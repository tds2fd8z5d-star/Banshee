# ============================================================
#  Настройки мастера. Чтобы перенастроить бота под другого
#  мастера, достаточно отредактировать этот файл и .env.
# ============================================================

master:
  name: "Анна Смирнова"
  specialization: "Маникюр · брови · ресницы"
  address: "Москва, ул. Пушкина, д. 10, кв. 5 (домофон 5)"
  phone: "+7 900 123-45-67"
  portfolio_url: "https://t.me/anna_nails_portfolio"

# Часовой пояс, в котором работает мастер
timezone: "Europe/Moscow"

# Дополнительные Telegram ID администраторов (необязательно).
# Основной ID мастера задаётся в .env (ADMIN_IDS).
admin_ids: []

booking:
  days_ahead: 14            # на сколько дней вперёд можно записаться
  slot_step_minutes: 30     # шаг сетки времени (10:00, 10:30, 11:00 …)
  min_lead_minutes: 60      # минимум минут от «сейчас» до начала записи
  cancel_deadline_hours: 3  # позже этого срока клиент не может отменить/перенести сам (0 — без ограничений)

reminders:
  first_hours: 24           # первое напоминание за N часов
  second_hours: 2           # второе напоминание за N часов
  admin_digest_time: "09:00"  # утренняя сводка мастеру на сегодня ("" — выключить)

# Рабочие дни и часы. Отсутствующий день или null — выходной.
# breaks — перерывы, в которые запись невозможна.
schedule:
  mon: { start: "10:00", end: "20:00", breaks: ["14:00-15:00"] }
  tue: { start: "10:00", end: "20:00", breaks: ["14:00-15:00"] }
  wed: { start: "10:00", end: "20:00", breaks: ["14:00-15:00"] }
  thu: { start: "10:00", end: "20:00", breaks: ["14:00-15:00"] }
  fri: { start: "10:00", end: "20:00", breaks: ["14:00-15:00"] }
  sat: { start: "11:00", end: "17:00", breaks: [] }
  sun: null

# Начальный список услуг. Загружается в базу при ПЕРВОМ запуске,
# дальше услуги и цены редактируются прямо из бота (/admin → Услуги).
services:
  - name: "Маникюр без покрытия"
    price: 1200
    duration: 60
  - name: "Маникюр + гель-лак"
    price: 2200
    duration: 120
  - name: "Наращивание ногтей"
    price: 3500
    duration: 150
  - name: "Коррекция и окрашивание бровей"
    price: 1300
    duration: 60
  - name: "Ламинирование бровей"
    price: 2000
    duration: 90
  - name: "Наращивание ресниц (классика)"
    price: 2500
    duration: 120
  - name: "Ламинирование ресниц"
    price: 2300
    duration: 90
